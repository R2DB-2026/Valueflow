<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="สิบกิจกรรมที่ทำให้คุณค่าหมุน ดูบนวงล้อหรือไทม์ไลน์ กรองตามผู้เล่นและมุมมอง">
<title>กิจกรรมที่ทำให้คุณค่าหมุน</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/events.css">
</head>
<body data-page="events">
<header id="site-header"></header>
<main>
  <section class="page-head">
    <div class="wrap">
      <h1>กิจกรรมคือจังหวะที่คุณค่าเปลี่ยนมือ</h1>
      <p class="lead">Hackathon, Data Challenge, Demo Day และเวทีอื่นอีกหกแบบ ไม่ใช่งานประชาสัมพันธ์ แต่เป็นจุดที่โจทย์ ทีม ทุน และข้อมูลมาพบกัน กรองตามผู้เล่นหรือมุมมอง แล้วสลับระหว่างวงล้อกับไทม์ไลน์</p>
      <div class="filters">
        <div class="seg light" id="view" role="group" aria-label="มุมมองการแสดงผล"></div>
        <div class="seg light" id="lens" role="group" aria-label="กรองตามชนิดของคุณค่า"></div>
        <div class="seg light" id="aud" role="group" aria-label="กรองตามผู้เล่น"></div>
      </div>
    </div>
  </section>

  <section class="wrap">
    <div class="split">
      <div id="stage">
        <div class="dark wheel" id="wheelbox">
          <svg id="wheel" viewBox="0 0 900 640" role="img" aria-label="วงล้อสิบกิจกรรม"></svg>
        </div>
        <div class="timeline" id="timeline" hidden></div>
        <p class="small muted" id="count" aria-live="polite" style="margin-top:10px"></p>
      </div>
      <aside class="side" id="evside" aria-live="polite"></aside>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/events.js"></script>
</body>
</html>
