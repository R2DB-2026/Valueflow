<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="เครือข่ายผู้เล่นห้าฝ่ายและแพลตฟอร์มกลาง ว่าแต่ละฝ่ายให้อะไรและได้อะไร">
<title>ผู้เล่นและการส่งต่อคุณค่า</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/players.css">
</head>
<body data-page="players">
<header id="site-header"></header>
<main>
  <section class="page-head">
    <div class="wrap">
      <h1>ใครให้อะไรใคร</h1>
      <p class="lead">ห้าฝ่ายและแพลตฟอร์มกลางแลกเปลี่ยนกันหลายอย่าง ไม่ใช่แค่เงิน คลิกผู้เล่นเพื่อดูเส้นทางคุณค่าเข้าและออก หรือกรองเฉพาะชนิดที่สนใจ</p>
      <div class="seg light" id="types" role="group" aria-label="กรองชนิดของคุณค่า"></div>
    </div>
  </section>
  <section class="wrap">
    <div class="split">
      <div class="dark net">
        <svg id="net" viewBox="0 0 760 640" role="img" aria-label="เครือข่ายการส่งต่อคุณค่าระหว่างผู้เล่น"></svg>
      </div>
      <aside class="side" id="side" aria-live="polite"></aside>
    </div>
    <p class="small muted" style="margin-top:12px">เส้นและการแลกเปลี่ยนเป็นการสังเคราะห์จากบทบาทที่ปรากฏในสไลด์และแผนยุทธศาสตร์ ผู้เล่นแต่ละฝ่ายควรยืนยันก่อนใช้เป็นข้อตกลงจริง</p>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/players.js"></script>
</body>
</html>
